type: custom:streaming-browser-card

title: Streaming

platform: webos

# CHANGE THIS to your LG webOS media_player entity.
tv_entity: media_player.lg_webos_tv_ur7800psb

# CHANGE THIS to your TMDB v3 API key.
tmdb_api_key: YOUR_TMDB_V3_API_KEY

region: MX
selected_provider_ids:
  - 8    # Netflix
  - 337  # Disney Plus
  - 119  # Amazon Prime Video
language: es-MX

poster_width: 145
max_items: 24
include_rent_buy: false

# -------------------------------------------------------------------
# LG webOS timing
# -------------------------------------------------------------------

wake_delay_ms: 4500
relaunch_delay_ms: 1200
auto_play_delay_ms: 4000



# Wait after sending an exact-title Watchmode link before PLAY.
exact_title_play_delay_ms: 5000

# Prepare/open the app and run profile/PIN before exact-title URL.
exact_title_prepare_profile: true

# Backend HA script that queries Watchmode securely.
watchmode_script: script.streaming_watchmode_sources

# If Watchmode cannot find/open an exact title, fall back to opening
# the normal streaming app.
exact_title_fallback_to_app: true

# -------------------------------------------------------------------
# Optional Home Assistant profile helper
# -------------------------------------------------------------------
#
# Remove this line if you do not use the helper.
#
profile_entity: input_select.streaming_profile

default_profile: Felipe


# App visibility and profile navigation are managed inside the card backend.
# Current built-in apps: Netflix, Disney+, and Prime Video.
# Use profile_entity to provide profile names; the card uses their order as profile positions.
