# Add these to your existing /config/secrets.yaml.
# Replace the placeholder values locally in Home Assistant.

# Only needed for apps/profiles where Felipe has a profile PIN.
streaming_pin_felipe: "YOUR_PROFILE_PIN"

# Get a Watchmode API key from Watchmode.
# This key stays on the Home Assistant backend and is not placed in Lovelace.
watchmode_api_key: "YOUR_WATCHMODE_API_KEY"