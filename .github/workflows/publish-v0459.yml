name: Publish Streaming Browser Card v0.4.59

on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-v0459.yml"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm version and publish release for HACS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -q 'const STREAMING_BROWSER_VERSION = "0.4.59";' streaming-browser-card.js
          node --check streaming-browser-card.js
          if gh release view v0.4.59 >/dev/null 2>&1; then
            echo 'Release already exists.'
          else
            gh release create v0.4.59 --target "$(git rev-parse HEAD)" --title v0.4.59 --notes 'Keep visual configuration sections open while editing and populate the HDMI input dropdown from the selected display TV available sources.'
          fi
