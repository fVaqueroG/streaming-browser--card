name: Publish Streaming Browser Netflix episode TV fix v0.4.89
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-netflix-episode-tv-v0489.yml'
permissions:
  contents: write
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Netflix TV episode launch fix
        run: python3 tools/apply-netflix-episode-tv-v0489.py
      - name: Test episode-specific launch and unchanged card features
        run: |
          node --check tools/streaming-browser-netflix-episode-tv-v0489.js
          node --check custom_components/streaming_browser/frontend/streaming-browser-card.js
          node tools/test-netflix-episode-tv-v0489.js
          python3 -m compileall -q custom_components/streaming_browser
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('custom_components/streaming_browser')
          source=(base/'frontend/streaming-browser-card.js').read_text()
          meta=json.loads((base/'manifest.json').read_text())
          assert meta['version']=='0.4.89'
          assert source.count('const STREAMING_BROWSER_VERSION = "0.4.89";')==1
          for token in ('/* Streaming Browser v0.4.89: Netflix episode TV app-specific launch. */',
                        '/* Streaming Browser v0.4.88: episode > season > series; WatchHub last. */',
                        '/* Streaming Browser v0.4.88: series link routing finalization. */',
                        '/* Streaming Browser v0.4.86: optional ADB remote entity',
                        '/* Compact action captions v0.4.84 */'):
              assert token in source,token
          print('PASS v0.4.89 manifest, episode/season/series priority, WatchHub, optional ADB and compact actions')
          PY
      - name: Commit and publish v0.4.89
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md custom_components/streaming_browser/frontend/streaming-browser-card.js custom_components/streaming_browser/manifest.json
          git commit -m 'v0.4.89: use Netflix app-specific TV episode launch'
          git push origin HEAD:main
          gh release create v0.4.89 --target "$(git rev-parse HEAD)" --title v0.4.89 --notes 'Fix Netflix Play on TV opening only the app when an episode URL contains trackId. Android TV now targets the selected episode ID with Netflix native app intent (optional ADB media player/remote when configured, standard Android TV Remote otherwise). LG webOS sends the full selected episode URL with trackId as Netflix contentTarget, with an episode-specific fallback on service rejection. Play in device and source ordering remain unchanged: episode, season, series; WatchHub last. Existing rooms and controls are retained. Device-specific Netflix behavior requires validation on the installed app.'
