name: Release popup text heading v0.4.125
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-popup-text-title-v04125-final.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace popup heading and bump HACS version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('custom_components/streaming_browser')
          p=root/'frontend/streaming-browser-popup-card.js'
          s=p.read_text()
          start=s.index('    // The popup heading uses the transparent horizontal logo')
          end=s.index("  const content = dialog.querySelector('.sb-popup-content');",start)
          assert 'heading.replaceChildren(headingLogo, headingFallback);' in s[start:end]
          s=s[:start]+(
            '    // Keep the modal title plain text; V2 displays the logo below.\n'
            "    const heading = dialog.querySelector('.sb-popup-heading');\n"
            "    heading.textContent = String(this._config.button_label || this._config.title || 'Streaming Browser');\n"
          )+s[end:]
          start=s.index('      .sb-popup-heading-logo {')
          end=s.index('        .sb-popup-close {',start)
          s=s[:start]+s[end:]
          assert 'headingLogo' not in s and 'sb-popup-heading-logo' not in s
          assert 'streaming-browser-horizontal-v124.png?v=0.4.124' in s
          assert 'button.appendChild(image);' in s
          s=s.replace('?v=0.4.124','?v=0.4.125')
          p.write_text(s)
          m=root/'manifest.json'
          d=json.loads(m.read_text())
          assert d['version']=='0.4.124',d['version']
          d['version']='0.4.125'
          m.write_text(json.dumps(d,indent=2)+'\n')
          v=root/'frontend/streaming-browser-card-v2.js'
          s=v.read_text()
          assert 'const STREAMING_BROWSER_VERSION = "0.4.124";' in s
          s=s.replace('const STREAMING_BROWSER_VERSION = "0.4.124";','const STREAMING_BROWSER_VERSION = "0.4.125";')
          v.write_text(s.replace('?v=0.4.124','?v=0.4.125'))
          print('PASS popup header text and version changes')
          PY
      - name: Validate popup, V2 and images
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          node --check custom_components/streaming_browser/frontend/streaming-browser-popup-card.js
          node --check custom_components/streaming_browser/frontend/streaming-browser-card-v2.js
          python3 -m compileall -q custom_components/streaming_browser
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          base=Path('custom_components/streaming_browser')
          popup=(base/'frontend/streaming-browser-popup-card.js').read_text()
          v2=(base/'frontend/streaming-browser-card-v2.js').read_text()
          assert json.loads((base/'manifest.json').read_text())['version']=='0.4.125'
          assert "heading.textContent = String(this._config.button_label || this._config.title || 'Streaming Browser');" in popup
          assert 'headingLogo' not in popup
          assert 'button.appendChild(image);' in popup and 'card.setConfig(cardConfig);' in popup
          assert 'const STREAMING_BROWSER_VERSION = "0.4.125";' in v2
          for name in ('horizontal','vertical','icon'):
            with Image.open(base/'frontend/assets'/f'streaming-browser-{name}-v124.png') as image:
              image.load()
            assert f'streaming-browser-{name}-v124.png?v=0.4.125' in popup
          print('PASS text-only popup header, launcher modes, V2 logo, valid images, JS and Python syntax')
          PY
      - name: Commit and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/streaming_browser/manifest.json custom_components/streaming_browser/frontend/streaming-browser-popup-card.js custom_components/streaming_browser/frontend/streaming-browser-card-v2.js
          git commit -m 'v0.4.125 popup uses text heading, V2 keeps horizontal logo'
          git push origin HEAD:main
          gh release create v0.4.125 --target "$(git rev-parse HEAD)" --title 'v0.4.125' --notes 'Fix duplicate branding in popup: the popup heading shows plain text using the configured button label while the embedded V2 card retains its horizontal logo. Launcher button appearance options and playback remain unchanged. HACS and frontend cache version bumped to 0.4.125.'
