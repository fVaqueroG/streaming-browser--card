name: Publish V2 preserved room controls v0.4.106
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v2-preserved-rooms-v04106.yml'
permissions:
  contents: write
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch the independent V2 room and profile event handling
        run: python3 tools/v2-preserve-room-controls-v04106.py
      - name: Check V1 isolation and V2 incremental rendering
        run: |
          node --check custom_components/streaming_browser/frontend/streaming-browser-card-v2.js
          node --check custom_components/streaming_browser/frontend/streaming-browser-card.js
          python3 -m compileall -q custom_components/streaming_browser
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('custom_components/streaming_browser')
          v1=(root/'frontend/streaming-browser-card.js').read_text()
          v2=(root/'frontend/streaming-browser-card-v2.js').read_text()
          assert json.loads((root/'manifest.json').read_text())['version']=='0.4.106'
          assert 'const STREAMING_BROWSER_VERSION = "0.4.98";' in v1
          assert 'const STREAMING_BROWSER_VERSION = "0.4.106";' in v2
          assert "top.querySelector('.sbr-room-controls')" in v2
          assert "this._v2ForceFullRender = true;\n    try { this._render(); }" in v2
          assert "body.querySelectorAll('[data-profile]').forEach(button =>" in v2
          assert 'this._v2CommitMainMarkup(`' in v2
          assert 'if (!this._v2PartialRender) this._bindEvents();' in v2
          assert 'if (this._v2IncrementalCommitted)' in v2
          assert 'this._v2CatalogStamp !== stamp' in v2
          assert 'body.replaceChildren(...children);' in v2
          assert 'chips.replaceChildren(' in v2
          print('PASS V1 unchanged, V2 incremental catalog and stable nonduplicated room controls')
          PY
          git diff --exit-code -- custom_components/streaming_browser/frontend/streaming-browser-card.js
      - name: Publish v0.4.106
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md custom_components/streaming_browser/manifest.json custom_components/streaming_browser/frontend/streaming-browser-card-v2.js
          git commit -m 'v0.4.106: keep one stable room selector during V2 incremental updates'
          git push origin HEAD:main
          gh release create v0.4.106 --target "$(git rev-parse HEAD)" --title v0.4.106 --notes 'Complete V2 incremental catalog updates: fixed controls keep DOM, scroll and focus on selections; prevent duplicated room selectors; retain profile chip handlers. Room switches may rebuild route-specific controls. V1 and playback unchanged.'
