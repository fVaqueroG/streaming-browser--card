name: Publish validated app switching v0.4.97
on:
  push:
    branches: [main]
    paths: ['.github/workflows/app-switch-v0497-release-fix.yml']
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply previous app-switch patch using corrected validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, textwrap
          source = Path('.github/workflows/close-previous-streaming-app-v0497.yml').read_text()
          assert "patch = r'''" in source
          raw = source.split("patch = r'''", 1)[1].split("          '''", 1)[0]
          patch = textwrap.dedent(raw).strip()
          assert patch.startswith('/* Streaming Browser v0.4.97:')
          path = Path('custom_components/streaming_browser/frontend/streaming-browser-card.js')
          text = path.read_text()
          assert 'const STREAMING_BROWSER_VERSION = "0.4.96";' in text
          assert '/* Streaming Browser v0.4.97: close a different foreground' not in text
          path.write_text(text.replace('const STREAMING_BROWSER_VERSION = "0.4.96";',
                                       'const STREAMING_BROWSER_VERSION = "0.4.97";', 1).rstrip() + '\n\n' + patch + '\n')
          manifest = Path('custom_components/streaming_browser/manifest.json')
          data = json.loads(manifest.read_text())
          assert data['version'] == '0.4.96'
          data['version'] = '0.4.97'
          manifest.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Verify syntax and safeguards
        shell: bash
        run: |
          node --check custom_components/streaming_browser/frontend/streaming-browser-card.js
          python3 - <<'PY'
          from pathlib import Path
          s = Path('custom_components/streaming_browser/frontend/streaming-browser-card.js').read_text()
          p = s.split('/* Streaming Browser v0.4.97: close a different foreground', 1)[1]
          for needle in ["target.key === previous.key", "am force-stop ", "_androidAdbEntity?.()", "wrap('_openExactTitle'", "wrap('_launchProvider'", "wrap('_primeOpenGti'", "wrap('_playCrunchyrollWatch'"]:
              assert needle in p, needle
          assert 'keyevent 23' not in p
          assert '--es source 30 -n com.netflix.ninja/.MainActivity' in s
          print('PASS: JS syntax, same-app guard, ADB-only force stop, Netflix source=30/no extra key')
          PY
      - name: Commit and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/streaming_browser/frontend/streaming-browser-card.js custom_components/streaming_browser/manifest.json
          git commit -m 'v0.4.97: close previous app when switching streaming providers'
          git push origin HEAD:main
          gh release create v0.4.97 --target "$(git rev-parse HEAD)" --title v0.4.97 --notes 'Android TV closes recognized previous streaming app with ADB force-stop, or exits via HOME when ADB is unavailable. LG webOS and Roku use HOME to leave the previous app; true process termination is not available through their standard remote. Same-app sessions, Netflix source=30 with no keyevent 23, episode > season > series, and room/HDMI routing are preserved.'
