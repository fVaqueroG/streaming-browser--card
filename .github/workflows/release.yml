name: Publish Streaming Browser integration release
on:
  push:
    branches: [main]
    paths:
      - "custom_components/streaming_browser/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify single HACS package and version alignment
        id: version
        shell: bash
        run: |
          node --check custom_components/streaming_browser/frontend/streaming-browser-card.js
          node --check custom_components/streaming_browser/frontend/streaming-browser-card-v2.js
          python3 -m compileall -q custom_components/streaming_browser
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          base=Path('custom_components/streaming_browser')
          meta=json.loads((base/'manifest.json').read_text())
          assert meta['domain']=='streaming_browser' and meta['config_flow']
          source=(base/'frontend/streaming-browser-card.js').read_text()
          v2=(base/'frontend/streaming-browser-card-v2.js').read_text()
          found=re.search(r'const STREAMING_BROWSER_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)";',source)
          found_v2=re.search(r'const STREAMING_BROWSER_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)";',v2)
          assert found and found_v2, 'Bundled card version label missing'
          assert found.group(1)==meta['version'], 'Bump manifest.version and bundled V1 JS version before release'
          assert found_v2.group(1)==meta['version'], 'Bump manifest.version and bundled V2 JS version before release'
          assert '_captureCatalogReturnPosition()' in v2
          assert 'this._captureCatalogReturnPosition();' in v2
          assert 'this._restoreCatalogReturnPosition();' in v2
          assert 'this._closeDetails()' in v2
          assert (base/'config_flow.py').exists() and (base/'justwatch.py').exists()
          with open('/tmp/streaming-browser-version','w') as file:
              file.write(meta['version'])
          print('PASS: matched integration and card versions', meta['version'])
          PY
          echo "version=v$(cat /tmp/streaming-browser-version)" >> "$GITHUB_OUTPUT"
      - name: Create matching HACS integration release if new
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Already released: $VERSION"
            exit 0
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
