name: Streaming Browser v0.4.66 named card and visual editor
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/card-picker-v0466.yml"
permissions:
  contents: write
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix card picker discovery, visual editor, and versioned frontend loading
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          base = Path('custom_components/streaming_browser')
          js_path = base / 'frontend/streaming-browser-card.js'
          js = js_path.read_text(encoding='utf-8')
          def once(text, before, after, label):
              count = text.count(before)
              if count != 1:
                  raise AssertionError(f'{label}: expected one occurrence, got {count}')
              return text.replace(before, after, 1)
          js = once(js, ' * v0.4.65\n', ' * v0.4.66\n', 'card header version')
          js = once(js, 'const STREAMING_BROWSER_VERSION = "0.4.65";', 'const STREAMING_BROWSER_VERSION = "0.4.66";', 'card header label version')
          js = once(js, 'static async getConfigElement() {', 'static getConfigElement() {', 'editor factory must return HTMLElement synchronously')
          start = js.index('window.customCards = window.customCards || [];')
          end = js.index('\nconsole.info(', start)
          old = js[start:end]
          assert 'name: "Streaming Browser Card"' in old and 'preview: false' in old
          registry = '''// Home Assistant discovers cards by this registry entry when the Add card picker opens.
// Update an entry from an earlier resource instead of leaving stale metadata behind.
window.customCards = Array.isArray(window.customCards) ? window.customCards : [];
const streamingBrowserPickerEntry = {
  type: "streaming-browser-card",
  name: "Streaming Browser Card",
  description: "Browse streaming movies and series, select a provider and playback device, and open titles on your TV or this device.",
  preview: false,
  documentationURL: "https://github.com/fVaqueroG/streaming-browser--card",
};
const streamingBrowserExistingPickerEntry = window.customCards.find(
  (card) => card?.type === streamingBrowserPickerEntry.type
);
if (streamingBrowserExistingPickerEntry) {
  Object.assign(streamingBrowserExistingPickerEntry, streamingBrowserPickerEntry);
} else {
  window.customCards.push(streamingBrowserPickerEntry);
}
'''
          js = js[:start] + registry + js[end:]
          js = once(js, '"%c STREAMING-BROWSER-CARD %c v0.4.62 "', '"%c STREAMING-BROWSER-CARD %c v0.4.66 "', 'console version')
          js_path.write_text(js, encoding='utf-8')
          init_path = base / '__init__.py'
          init = init_path.read_text(encoding='utf-8')
          init = once(init, '''    await hass.http.async_register_static_paths(
        [StaticPathConfig(_CARD_URL, str(_CARD_FILE), cache_headers=False)]
    )

    lovelace = hass.data.get(LOVELACE_DATA)
    if lovelace is None or lovelace.resource_mode != MODE_STORAGE:
        frontend.add_extra_js_url(hass, _RESOURCE_URL)
        return
''', '''    await hass.http.async_register_static_paths(
        [StaticPathConfig(_CARD_URL, str(_CARD_FILE), cache_headers=False)]
    )
    # Load the same versioned module globally, so the named card is registered
    # before the card picker opens even on views that do not contain the card.
    # The Lovelace module resource below uses the IDENTICAL URL; browser module
    # imports of the same URL share one evaluation rather than defining twice.
    frontend.add_extra_js_url(hass, _RESOURCE_URL)

    lovelace = hass.data.get(LOVELACE_DATA)
    if lovelace is None or lovelace.resource_mode != MODE_STORAGE:
        return
''', 'always load card in picker as well as Lovelace resource')
          init_path.write_text(init, encoding='utf-8')
          manifest_path = base / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['version'] == '0.4.65'
          manifest['version'] = '0.4.66'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          preface = '''## Find the card by name (v0.4.66)

After updating **Streaming Browser** in HACS under **Integrations** and restarting Home Assistant, refresh the dashboard. In **Edit dashboard > Add card**, search for **Streaming Browser Card**, select its named card, and complete the visual editor. Do not select a Manual card or paste YAML. The integration loads the same versioned JavaScript globally for card-picker discovery and as a dashboard resource; both use the bundled version. Your existing dashboard cards and saved settings are preserved.

'''
          assert '## Find the card by name (v0.4.66)' not in text
          readme.write_text(text.replace('# Streaming Browser — Home Assistant Integration\n', '# Streaming Browser — Home Assistant Integration\n\n' + preface, 1).replace('**Current version: v0.4.65.**', '**Current version: v0.4.66.**', 1), encoding='utf-8')
          print('BUILD OK: synchronous graphical editor; named picker entry; resource loaded in global frontend and Lovelace, aligned v0.4.66')
          PY
      - name: Verify JavaScript, picker/editor contract, and integration packaging
        shell: bash
        run: |
          node --check custom_components/streaming_browser/frontend/streaming-browser-card.js
          python3 -m compileall -q custom_components/streaming_browser
          node - <<'JS'
          const fs = require('node:fs'), vm = require('node:vm');
          const src = fs.readFileSync('custom_components/streaming_browser/frontend/streaming-browser-card.js', 'utf8');
          const custom = new Map();
          const previouslyRegistered = {type:'streaming-browser-card', name:'Old card', preview:true};
          const window = {customCards:[previouslyRegistered]};
          const document = {createElement(name){return {tagName:name.toUpperCase()};}};
          const context = {HTMLElement:class{},customElements:{get(name){return custom.get(name)},define(name,c){custom.set(name,c)}},window,document,console};
          vm.runInNewContext(src,context);
          const Card=custom.get('streaming-browser-card');
          const Editor=custom.get('streaming-browser-card-editor');
          if(!Card || !Editor) throw Error('Custom card or editor element not registered');
          const entry=window.customCards.filter(c=>c.type==='streaming-browser-card');
          if(entry.length!==1 || entry[0]!==previouslyRegistered || entry[0].name!=='Streaming Browser Card' || entry[0].preview!==false)
            throw Error('Named card metadata not updated or duplicated');
          const editor=Card.getConfigElement();
          if(!editor || typeof editor.then==='function' || editor.tagName!=='STREAMING-BROWSER-CARD-EDITOR')
            throw Error('getConfigElement must return a real editor element synchronously');
          const stub=Card.getStubConfig();
          if(stub.tv_entity!=='' || stub.tmdb_api_key!=='' || Object.hasOwn(stub,'type'))
            throw Error('New-card stub must be empty but editable, without a type override');
          console.log('PASS: discoverable by card name, synchronous visual editor, saved registry upgraded, valid stub');
          JS
          python3 - <<'PY'
          import ast, asyncio, json, logging, types
          from pathlib import Path
          base=Path('custom_components/streaming_browser')
          init=(base/'__init__.py').read_text()
          manifest=json.loads((base/'manifest.json').read_text())
          src=(base/'frontend/streaming-browser-card.js').read_text()
          assert manifest['version']=='0.4.66' and 'STREAMING_BROWSER_VERSION = "0.4.66"' in src
          fn=next(n for n in ast.parse(init).body if isinstance(n,ast.AsyncFunctionDef) and n.name=='_register_card')
          class ResourceCollection:
              def __init__(self): self.items=[]
              async def async_get_info(self): pass
              def async_items(self): return list(self.items)
              async def async_create_item(self,item): self.items.append({'id':'new', **item})
              async def async_update_item(self,id,item): next(x for x in self.items if x['id']==id).update(item)
              async def async_delete_item(self,id): self.items=[x for x in self.items if x['id']!=id]
          class Http:
              async def async_register_static_paths(self,paths): self.paths=paths
          async def check():
              c=ResourceCollection(); http=Http(); urls=[]
              hass=types.SimpleNamespace(data={'lovelace':types.SimpleNamespace(resource_mode='storage',resources=c)},http=http)
              versioned='/streaming_browser/streaming-browser-card.js?v=0.4.66'
              env={'HomeAssistant':object,'_CARD_FILE':base/'frontend/streaming-browser-card.js',
                   '_CARD_URL':'/streaming_browser/streaming-browser-card.js','_RESOURCE_URL':versioned,
                   '_LEGACY_CARD_URLS':{'/hacsfiles/streaming-browser--card/streaming-browser-card.js'},
                   '_LOGGER':logging.getLogger('verify'),'StaticPathConfig':lambda *a,**k:a,
                   'LOVELACE_DATA':'lovelace','MODE_STORAGE':'storage',
                   'CONF_URL':'url','CONF_TYPE':'type','CONF_ID':'id','CONF_RESOURCE_TYPE_WS':'type',
                   'frontend':types.SimpleNamespace(add_extra_js_url=lambda _h,url:urls.append(url))}
              exec(compile(ast.Module(body=[fn],type_ignores=[]),'<verification>','exec'),env)
              await env['_register_card'](hass)
              assert urls==[versioned],urls
              assert len(c.items)==1 and c.items[0]['url']==versioned and c.items[0]['type']=='module',c.items
              print('PASS: named-card JavaScript loaded globally and registered as exactly one same-version Lovelace module')
          asyncio.run(check())
          PY
      - name: Commit and publish HACS integration v0.4.66
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/streaming_browser/frontend/streaming-browser-card.js custom_components/streaming_browser/__init__.py custom_components/streaming_browser/manifest.json README.md
          git commit -m 'v0.4.66: register discoverable Streaming Browser Card with synchronous visual editor'
          git push origin HEAD:main
          gh release create v0.4.66 --target "$(git rev-parse HEAD)" --title v0.4.66 --notes 'Streaming Browser Card appears by name in Add card with its visual editor. The installed integration loads the same versioned frontend module globally and through the dashboard resource to improve picker discovery; existing card configurations are preserved.'