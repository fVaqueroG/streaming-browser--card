name: One selected-episode outline v0.4.71
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-episode-single-outline-v0471.yml'
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch episode selection border
        run: python3 tools/episode-single-outline-v0471.py
      - name: Validate card, layout and integration version
        shell: bash
        run: |
          node --check custom_components/streaming_browser/frontend/streaming-browser-card.js
          python3 -m compileall -q custom_components/streaming_browser
          node <<'JS'
          const fs=require('node:fs'),vm=require('node:vm');
          const src=fs.readFileSync('custom_components/streaming_browser/frontend/streaming-browser-card.js','utf8');
          const m=JSON.parse(fs.readFileSync('custom_components/streaming_browser/manifest.json','utf8'));
          if(m.version!=='0.4.71'||!src.includes('STREAMING_BROWSER_VERSION = "0.4.71"'))throw Error('Version mismatch');
          const registry=new Map(),window={customCards:[]};
          vm.runInNewContext(src,{HTMLElement:class{},window,customElements:{get:k=>registry.get(k),define:(k,C)=>registry.set(k,C)},console});
          const Card=registry.get('streaming-browser-card');
          if(!Card||!registry.get('streaming-browser-card-editor'))throw Error('Card/editor missing');
          if(!window.customCards.some(card=>card.type==='streaming-browser-card'))throw Error('Named card missing');
          const prototype=Card.prototype;
          const styles=prototype._detailStyles.call({});
          const wrapper=styles.match(/\.episode-row-container\.selected\s*\{([^}]+)\}/)?.[1]||'';
          if(!/border\s*:\s*2px solid var\(--primary-color\)/.test(wrapper)||!/border-radius\s*:\s*12px/.test(wrapper))throw Error('Shared 2px blue selected border missing');
          const child=styles.match(/\.episode-row-container\.selected \.episode-row\.active\s*\{([^}]+)\}/)?.[1]||'';
          if(!/border\s*:\s*0/.test(child)||!/box-shadow\s*:\s*none/.test(child))throw Error('Nested blue episode row outline remains');
          const links=styles.match(/\.episode-inline-actions\s*\{([^}]+)\}/)?.[1]||'';
          if(!/border\s*:\s*0/.test(links)||!/border-top\s*:\s*1px solid var\(--divider-color\)/.test(links))throw Error('Expanded links still have their own blue outline');
          const mock={_t:s=>s,_esc:s=>String(s),_img:()=>'',_config:{region:'MX'},_locale:()=> 'en',_renderProviderCards:()=>''};
          const detail={seriesSeasons:[{season_number:1}],selectedSeason:1,selectedEpisode:{episode_number:3},episodes:[{episode_number:2,name:'Two'},{episode_number:3,name:'Three'}],episodeSourcesLoading:false,episodeSources:[{web_url:'https://example.com'}],providersLoading:false};
          const html=prototype._renderEpisodeBrowser.call(mock,detail);
          const selected=html.match(/<div class="episode-row-container selected">/g)||[];
          const ordinary=html.match(/<div class="episode-row-container ">/g)||[];
          if(selected.length!==1||ordinary.length!==1||!html.includes('class="episode-inline-actions"'))throw Error('Only selected episode must have shared border');
          console.log('PASS: single continuous 2px border for episode + links; no nested accent outline; card and editor intact');
          JS
      - name: Publish HACS Integration v0.4.71
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/streaming_browser/frontend/streaming-browser-card.js custom_components/streaming_browser/manifest.json
          git commit -m 'Use one uniform outline for selected episode and its sources v0.4.71'
          git push origin HEAD:main
          gh release create v0.4.71 --target "$(git rev-parse HEAD)" --title v0.4.71 --notes 'Make the selected episode and expanded streaming links one continuous panel with a single uniform 2px accent border. Remove the duplicate row and links outlines, keep a neutral separator, preserve detail scrolling and existing card configuration. Update HACS Integrations, restart Home Assistant, and fully reload the dashboard.'