name: Bundle Streaming Browser integration v0.4.63
on:
  push:
    branches: [main]
    paths: [".github/workflows/bundle-integration-v0463.yml"]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble self-contained integration and docs
        run: python3 tools/bundle-integration-v0463.py
      - name: Validate frontend, Python backend, HACS package and matching versions
        shell: bash
        run: |
          node --check custom_components/streaming_browser/frontend/streaming-browser-card.js
          python3 -m compileall -q custom_components/streaming_browser
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('custom_components/streaming_browser')
          manifest=json.loads((base/'manifest.json').read_text())
          s=(base/'frontend/streaming-browser-card.js').read_text()
          init=(base/'__init__.py').read_text()
          assert manifest['domain']=='streaming_browser' and manifest['config_flow']
          assert manifest['version']=='0.4.63' and 'STREAMING_BROWSER_VERSION = "0.4.63"' in s
          assert (base/'config_flow.py').exists() and (base/'justwatch.py').exists()
          assert 'streaming_browser/episode_links' in s and init
          assert '/nuvio/nuvio-card.js' not in s and '"nuvio", "remote_key"' not in s
          assert 'async_register_static_paths' in init and '_RESOURCE_URL' in init
          assert 'filename' not in json.loads(Path('hacs.json').read_text())
          print('PASS: JS syntax, Python syntax, HACS integration structure, and matched versions')
          PY
      - name: Commit validated integration and publish v0.4.63
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md EPISODE_LINKS_SETUP.md custom_components/streaming_browser/frontend/streaming-browser-card.js
          git commit -m 'v0.4.63: bundle frontend and episode resolver in one HACS integration'
          git push origin HEAD:main
          gh release create v0.4.63 --target "$(git rev-parse HEAD)" --title v0.4.63 --notes 'Streaming Browser is now a standalone HACS Integration: dashboard card, UI setup, versioned resource and independent episode-link backend update as one package. Migrate the previous Dashboard HACS installation once; see README for instructions.'
