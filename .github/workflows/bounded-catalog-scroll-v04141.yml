name: Streaming Browser bounded catalog and return to beginning v0.4.141
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bounded-catalog-scroll-v04141.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add a bounded vertical catalog and an always accessible return-to-start button
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('custom_components/streaming_browser')
          manifest=base/'manifest.json'
          metadata=json.loads(manifest.read_text(encoding='utf-8'))
          assert metadata['version']=='0.4.140', f"Unexpected base version: {metadata['version']}"
          path=base/'frontend/streaming-browser-card-v2.js'
          source=path.read_text(encoding='utf-8')
          def replace_once(old,new):
              global source
              count=source.count(old)
              assert count==1, f'Expected one occurrence of {old[:90]!r}; found {count}'
              source=source.replace(old,new,1)
          replace_once('    const detailScrollTop = this.shadowRoot.querySelector(".detail")?.scrollTop ?? null;',
             '    const detailScrollTop = this.shadowRoot.querySelector(".detail")?.scrollTop ?? null;\n'
             '    const catalogScrollTop = this.shadowRoot.querySelector(".catalog")?.scrollTop ?? null;')
          replace_once('        .catalog, .catalog-section, .catalog-row {',
              '''        /* Keep the catalog in its own viewport, like the Totalplay guide. */
              .catalog {
                max-height: min(62dvh, 680px);
                overflow-y: auto;
                overflow-x: hidden;
                overscroll-behavior-y: contain;
                scrollbar-gutter: stable;
                padding-right: 4px;
              }
              .sb-catalog-scroll-toolbar { display: flex; justify-content: flex-end; margin: 0 0 8px; }
              .sb-catalog-to-start {
                border: 1px solid var(--divider-color);
                border-radius: 18px;
                background: var(--secondary-background-color);
                color: var(--primary-text-color);
                padding: 7px 12px;
                font: inherit;
                font-size: 12px;
                cursor: pointer;
              }
              .sb-catalog-to-start:focus-visible { outline: 2px solid var(--primary-color); }
              .catalog, .catalog-section, .catalog-row {''')
          replace_once('          ${\n            this._loading\n              ? `\n                <div class="loading">',
              '''          ${!this._loading && this._sections.length ? `
                <div class="sb-catalog-scroll-toolbar">
                  <button class="sb-catalog-to-start" type="button"
                    title="Back to beginning" aria-label="Back to beginning">
                    ${this._locale().startsWith("es") ? "↑ Inicio" : "↑ Beginning"}
                  </button>
                </div>` : ""}

          ${
            this._loading
              ? `
                <div class="loading">''')
          replace_once('    if (detailScrollTop !== null) {\n      const detailPane',
              '''    if (catalogScrollTop !== null) {
      const catalogPane = this.shadowRoot.querySelector(".catalog");
      if (catalogPane) catalogPane.scrollTop = catalogScrollTop;
    }
    this.shadowRoot.querySelector(".sb-catalog-to-start")?.addEventListener("click", () => {
      this.shadowRoot.querySelector(".catalog")?.scrollTo({ top: 0, behavior: "smooth" });
    });
    if (detailScrollTop !== null) {
      const detailPane''')
          replace_once('const STREAMING_BROWSER_VERSION = "0.4.140";',
                       'const STREAMING_BROWSER_VERSION = "0.4.141";')
          path.write_text(source,encoding='utf-8')
          metadata['version']='0.4.141'
          manifest.write_text(json.dumps(metadata,indent=2)+'\n',encoding='utf-8')
          assert source.count('class="sb-catalog-to-start"')==1
          assert source.count('this.shadowRoot.querySelector(".catalog")?.scrollTop ?? null;')==1
          assert source.count('this.shadowRoot.querySelector(".catalog")?.scrollTo(')==1
          print('PASS: catalog has bounded internal vertical scroll; search and filter controls remain outside it')
          print('PASS: back-to-beginning button and scroll position restoration across re-renders')
          PY
          node --check custom_components/streaming_browser/frontend/streaming-browser-card-v2.js
          node --check custom_components/streaming_browser/frontend/streaming-browser-popup-card.js
          python3 -m json.tool custom_components/streaming_browser/manifest.json >/dev/null
          echo 'PASS: JavaScript syntax and integration manifest validation'
      - name: Commit and release v0.4.141
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/streaming_browser/manifest.json custom_components/streaming_browser/frontend/streaming-browser-card-v2.js
          git commit -m 'feat: bounded catalog scrolling and return to beginning (v0.4.141)'
          git push origin HEAD:main
          gh release create v0.4.141 --target "$(git rev-parse HEAD)" --title v0.4.141 --notes 'Keep the catalog scroll inside a bounded area beneath controls; add a return-to-beginning button and preserve its scroll position on card re-renders.'
