# Retest the rendered numeric keypad and native remote command wiring.
name: Publish Streaming Browser Nuvio-style remote v0.4.81
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-nuvio-style-remote-v0481.yml'
permissions:
  contents: write
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Streaming Browser remote layout without changing commands
        run: python3 tools/apply-nuvio-style-remote-v0481.py
      - name: Validate bundled card, remote commands, and integration
        run: |
          node --check custom_components/streaming_browser/frontend/streaming-browser-card.js
          node tools/test-nuvio-style-remote-v0481.js
          python3 -m compileall -q custom_components/streaming_browser
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('custom_components/streaming_browser')
          manifest=json.loads((base/'manifest.json').read_text())
          card=(base/'frontend/streaming-browser-card.js').read_text()
          assert manifest['version']=='0.4.81'
          assert 'const STREAMING_BROWSER_VERSION = "0.4.81";' in card
          assert card.count('/* Nuvio-inspired remote layout v0.4.81 */')==1
          assert '/* Streaming Browser v0.4.78: room and connection routing.' in card
          assert '/* Streaming Browser v0.4.79: optional per-connection power helper.' in card
          print('PASS matching integration/card version and preserved room and smart-plug features')
          PY
      - name: Commit tested integration and publish v0.4.81
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md custom_components/streaming_browser/frontend/streaming-browser-card.js custom_components/streaming_browser/manifest.json
          git commit -m 'v0.4.81: Nuvio-style TV remote preserving all Streaming Browser controls'
          git push origin HEAD:main
          gh release create v0.4.81 --target "$(git rev-parse HEAD)" --title v0.4.81 --notes 'Restyle the Streaming Browser TV remote as a Nuvio-inspired dark rounded popup with full-width Wake, circular D-pad, numeric keypad with backspace and Enter, prominent Back and Home, and all original playback, mute, and volume controls. The original Android TV, LG webOS, Roku, HDMI display volume, room, and power-helper logic is unchanged. Update the Streaming Browser HACS Integration, restart Home Assistant and refresh the dashboard.'