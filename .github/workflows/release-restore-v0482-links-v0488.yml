name: Publish Streaming Browser v0.4.88 historic link restore
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-restore-v0482-links-v0488.yml'
permissions:
  contents: write
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore v0.4.82 source and TV launch code
        run: python3 tools/restore-v0482-link-handling-v0488.py
      - name: Add scoped JustWatch fallback and keep WatchHub last
        run: |
          python3 tools/apply-series-link-priority-v0488.py
          python3 tools/finalize-link-priority-v0488.py
      - name: Validate JavaScript Python and link routing
        run: |
          node --check custom_components/streaming_browser/frontend/streaming-browser-card.js
          node --check tools/streaming-browser-series-priority-v0488.js
          node tools/test-v0482-link-restoration-v0488.js
          node tools/test-series-link-priority-v0488.js
          python3 -m compileall -q custom_components/streaming_browser
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('custom_components/streaming_browser')
          card=(root/'frontend/streaming-browser-card.js').read_text()
          init=(root/'__init__.py').read_text()
          jw=(root/'justwatch.py').read_text()
          assert json.loads((root/'manifest.json').read_text())['version']=='0.4.88'
          for marker in ('/* Streaming Browser v0.4.88: restored v0.4.82 link handling. */',
                         '/* Streaming Browser v0.4.88: episode > season > series; WatchHub last. */',
                         '/* Streaming Browser v0.4.86: optional ADB remote entity',
                         '/* Streaming Browser v0.4.83: optional WatchHub official-app link source.',
                         '/* Compact action captions v0.4.84 */','sbr-power-switch'):
              assert marker in card, marker
          assert 'streaming_browser/series_fallback_links' in init
          assert '_SEASON_OFFERS_QUERY' in jw
          print('PASS bundle version, scoped lookup, WatchHub, ADB remote, compact buttons and power helper')
          PY
      - name: Commit verified integration and publish v0.4.88
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md custom_components/streaming_browser/frontend/streaming-browser-card.js custom_components/streaming_browser/manifest.json custom_components/streaming_browser/__init__.py custom_components/streaming_browser/justwatch.py
          git commit -m 'v0.4.88: restore historic links and prefer episode, then season, then series with WatchHub last'
          git push origin HEAD:main
          gh release create v0.4.88 --target "$(git rev-parse HEAD)" --title v0.4.88 --notes 'Restore v0.4.82 Netflix, Prime Video and general TV app link handling while retaining the current compact action buttons, rooms, power helper and optional ADB remote. Select for each streaming provider an episode URL first, then a season URL, then a series URL. Within the same specificity, use Watchmode/JustWatch before WatchHub, which remains optional and last priority. Preserve an existing Netflix episode URL trackId query parameter without inventing one. If a provider offers only a series link, the button says Series rather than Episode. LG/Android TV app behavior still needs confirmation on installed devices. Update via HACS, restart Home Assistant, reload the dashboard.'
