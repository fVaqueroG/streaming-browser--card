name: Publish Streaming Browser action captions v0.4.84
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-source-action-captions-v0484.yml'
permissions:
  contents: write
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace redundant Open app button with two destination-caption actions
        run: python3 tools/apply-source-action-captions-v0484.py
      - name: Test layouts, actual command targets, and preserved existing features
        run: |
          node --check custom_components/streaming_browser/frontend/streaming-browser-card.js
          node tools/test-source-action-captions-v0484.js
          python3 -m compileall -q custom_components/streaming_browser
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('custom_components/streaming_browser')
          card=(base/'frontend/streaming-browser-card.js').read_text()
          manifest=json.loads((base/'manifest.json').read_text())
          assert manifest['version']=='0.4.84'
          assert card.count('const STREAMING_BROWSER_VERSION = "0.4.84";')==1
          assert card.count('/* Compact action captions v0.4.84 */')==1
          assert '/* Streaming Browser v0.4.83: optional WatchHub official-app link source. */' in card
          assert 'sbr-power-switch' in card
          print('PASS v0.4.84 manifest/frontend, retained WatchHub/room power and playback controls')
          PY
      - name: Commit tested integration and publish v0.4.84
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md custom_components/streaming_browser/frontend/streaming-browser-card.js custom_components/streaming_browser/manifest.json
          git commit -m 'v0.4.84: icon-only TV/device buttons with in-button destination labels'
          git push origin HEAD:main
          gh release create v0.4.84 --target "$(git rev-parse HEAD)" --title v0.4.84 --notes 'Replace the separate Open app button with compact TV and device icon buttons that display the resolved destination (Episode, Movie, or App) inside each button below the icon. The card never advertises an episode link when only a series URL exists, and Roku falls back to the app instead of treating a web URL as a Roku content ID. Spanish labels are localized. Existing WatchHub/Watchmode/JustWatch, room, smart plug, HDMI and compact remote behavior is preserved. Update the Streaming Browser HACS Integration, restart Home Assistant and reload the dashboard.'
