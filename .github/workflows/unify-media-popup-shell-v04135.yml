name: Unified media popup shell v0.4.135
'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/unify-media-popup-shell-v04135.yml
permissions:
  contents: write
jobs:
  unify-popup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply unified popup dimensions and header without replacing V2 card
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('custom_components/streaming_browser')
          popup_file = root / 'frontend/streaming-browser-popup-card.js'
          manifest_file = root / 'manifest.json'
          source = popup_file.read_text(encoding='utf-8')
          def replace_once(old, new):
              global source
              assert source.count(old) == 1, f'Expected exactly one popup rule: {old[:90]}'
              source = source.replace(old, new, 1)
          replace_once('box-shadow: 0 16px 60px #0006; width: min(96vw, 1180px);\n          max-width: 96vw; height: min(92dvh, 1050px); max-height: 92dvh;',
                       'box-shadow: 0 16px 60px #0006; width: min(1440px, calc(100vw - 24px));\n          max-width: calc(100vw - 24px); height: min(900px, calc(100dvh - 24px)); max-height: calc(100dvh - 24px);')
          replace_once('.streaming-browser-popup-dialog[data-size="normal"] { width: min(96vw, 850px); }',
                       '.streaming-browser-popup-dialog[data-size="normal"] { width: min(900px, calc(100vw - 24px)); height: min(700px, calc(100dvh - 24px)); }')
          replace_once('flex: 0 0 auto; padding: 8px 12px 8px 18px; min-height: 40px;',
                       'box-sizing: border-box; height: 48px; min-height: 48px; flex: 0 0 48px; padding: 0 12px 0 20px; gap: 12px;')
          replace_once('.sb-popup-close { width: 40px; height: 40px; display: grid; place-items: center;',
                       '.sb-popup-close { box-sizing: border-box; flex: 0 0 36px; width: 36px; height: 36px; padding: 0; display: grid; place-items: center;')
          replace_once('background: transparent; }\n        .sb-popup-close:hover',
                       'background: var(--secondary-background-color); }\n        .sb-popup-close:hover')
          replace_once('height: 100dvh; max-height: 100dvh; border-radius: 0; }\n        }',
                       'height: 100dvh; max-height: 100dvh; border-radius: 0; margin: 0; }\n          .sb-popup-header { height: 44px; min-height: 44px; flex-basis: 44px; padding: 0 8px 0 12px; }\n        }')
          popup_file.write_text(source, encoding='utf-8')
          manifest = json.loads(manifest_file.read_text(encoding='utf-8'))
          assert manifest['version'] == '0.4.134', manifest['version']
          manifest['version'] = '0.4.135'
          manifest_file.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          assert 'width: min(1440px, calc(100vw - 24px))' in source
          assert 'height: 48px; min-height: 48px' in source
          assert "const SB_POPUP_LOGOS" in source and "class StreamingBrowserPopupCardEditor" in source
          print('PASS: Streaming Browser popup has unified sizing and responsive header; V2 card and editor retained.')
          PY
          node --check custom_components/streaming_browser/frontend/streaming-browser-popup-card.js
          python3 -m json.tool custom_components/streaming_browser/manifest.json >/dev/null
      - name: Commit and release v0.4.135
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/streaming_browser/frontend/streaming-browser-popup-card.js custom_components/streaming_browser/manifest.json
          git commit -m 'v0.4.135: standardize Streaming Browser popup dimensions and header'
          git push origin HEAD:main
          gh release create v0.4.135 --target "$(git rev-parse HEAD)" --title 'v0.4.135' --notes 'Unify Normal (900 x 700), Wide (1440 x 900), and full-screen popups with the Totalplay and Nuvio shell. Standardize header at 48px desktop / 44px mobile and close icon at 36px. Keep existing brand logo, theme selection, visual editor, V2 card, streaming functionality and remote controls.'