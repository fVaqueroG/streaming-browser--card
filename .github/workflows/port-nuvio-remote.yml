name: Port Nuvio remote to Streaming Browser

on:
  push:
    branches: [main]
    paths: [".github/workflows/port-nuvio-remote.yml"]

permissions:
  contents: write

jobs:
  port-remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch card and check syntax
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/port_remote.py
          python3 /tmp/port_remote.py
          node --check streaming-browser-card.js
      - name: Commit and publish v0.4.57
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streaming-browser-card.js
          git commit -m 'v0.4.57: match Nuvio remote and use manual profiles'
          git push origin HEAD:main
          gh release create v0.4.57 --target "$(git rev-parse HEAD)" --title v0.4.57 --generate-notes
