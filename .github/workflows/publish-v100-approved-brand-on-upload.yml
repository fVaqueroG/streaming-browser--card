name: Publish exact uploaded Streaming Browser logos v0.4.131

on:
  push:
    branches: [main]
    paths:
      - 'branding/Streaming_Browser_uploaded_originals_v1.0.0.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streaming-browser-v04131-exact-uploaded-brand
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and install the exact three most recently uploaded original PNGs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256
          import json

          archive = Path('branding/Streaming_Browser_uploaded_originals_v1.0.0.zip')
          assert archive.is_file(), 'Upload the exact-originals archive to branding/ first'
          expected = {
              'horizontal': ('Streaming_Browser_v1.0.0_horizontal.png', '9c8008b3dc4e64edc57f371795295241daaef76f510e07a6cd6ae077c89f16dd'),
              'vertical': ('Streaming_Browser_v1.0.0_vertical.png', '02a9d0cd2a3d9a48bf6c6d637c977be9ef61ef0102fba9d66e3b090bf2d0db44'),
              'icon': ('Streaming_Browser_v1.0.0_icon.png', '02d109d00401b5cb910c6ac4171acb04706ef3567704e87d6b42c334b9c37c82'),
          }
          root = Path('custom_components/streaming_browser')
          assets = root / 'frontend' / 'assets'
          manifest = root / 'manifest.json'
          data = json.loads(manifest.read_text(encoding='utf-8'))
          assert data['version'] == '0.4.130', f"Unexpected version {data['version']}; review newer changes before releasing"
          with ZipFile(archive) as source:
              assert set(source.namelist()) == {item[0] for item in expected.values()}, 'Unexpected ZIP contents'
              for kind, (filename, digest) in expected.items():
                  original = source.read(filename)
                  assert original.startswith(b'\x89PNG\r\n\x1a\n'), f'Not a PNG: {filename}'
                  assert sha256(original).hexdigest() == digest, f'Artwork differs from user-uploaded original: {filename}'
                  (assets / f'streaming-browser-{kind}-v131.png').write_bytes(original)

          # Preserve all previous assets and the entire V1 card, playback handlers,
          # room settings and dashboard configuration. Change asset references only.
          v2file = root / 'frontend' / 'streaming-browser-card-v2.js'
          v2 = v2file.read_text(encoding='utf-8')
          version_marker = 'const STREAMING_BROWSER_VERSION = "0.4.130";'
          assert v2.count(version_marker) == 1, 'V2 version marker changed'
          v2 = v2.replace(version_marker, 'const STREAMING_BROWSER_VERSION = "0.4.131";', 1)
          old_header = '/streaming_browser/assets/streaming-browser-horizontal-v130.png?v=0.4.130'
          assert v2.count(old_header) == 1, 'V2 header reference changed'
          v2 = v2.replace(old_header, '/streaming_browser/assets/streaming-browser-horizontal-v131.png?v=0.4.131', 1)
          v2file.write_text(v2, encoding='utf-8')

          popupfile = root / 'frontend' / 'streaming-browser-popup-card.js'
          popup = popupfile.read_text(encoding='utf-8')
          for kind in expected:
              old = f'/streaming_browser/assets/streaming-browser-{kind}-v127.png?v=0.4.127'
              assert popup.count(old) == 1, f'Popup {kind} reference changed'
              popup = popup.replace(old, f'/streaming_browser/assets/streaming-browser-{kind}-v131.png?v=0.4.131', 1)
          popupfile.write_text(popup, encoding='utf-8')

          initfile = root / '__init__.py'
          init = initfile.read_text(encoding='utf-8')
          old_registry = 'for version in ("v124", "v127") for name in ("horizontal", "vertical", "icon")'
          assert init.count(old_registry) == 1, 'Static logo registry changed'
          init = init.replace(old_registry, 'for version in ("v124", "v127", "v131") for name in ("horizontal", "vertical", "icon")', 1)
          initfile.write_text(init, encoding='utf-8')

          theme = (root / 'frontend' / 'streaming-browser-branding.js').read_text(encoding='utf-8')
          assert 'Streaming Browser Brand v1.0.0' in theme and '#8B5CF6' in theme, 'Corporate theme is missing'
          data['version'] = '0.4.131'
          manifest.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          print('PASS: uploaded PNGs preserved byte-for-byte; all V2, popup, static routes and manifest references updated')
          PY
      - name: Check JS, Python, metadata and three installed PNG files
        run: |
          set -euo pipefail
          node --check custom_components/streaming_browser/frontend/streaming-browser-branding.js
          node --check custom_components/streaming_browser/frontend/streaming-browser-card-v2.js
          node --check custom_components/streaming_browser/frontend/streaming-browser-popup-card.js
          python3 -m py_compile custom_components/streaming_browser/__init__.py
          python3 -m json.tool custom_components/streaming_browser/manifest.json >/dev/null
          test "$(find custom_components/streaming_browser/frontend/assets -name '*-v131.png' | wc -l)" -eq 3
          echo 'PASS: updated integration syntax and exact logo assets verified'
      - name: Commit v0.4.131 and publish HACS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/streaming_browser/__init__.py custom_components/streaming_browser/manifest.json custom_components/streaming_browser/frontend/streaming-browser-card-v2.js custom_components/streaming_browser/frontend/streaming-browser-popup-card.js custom_components/streaming_browser/frontend/assets/*-v131.png
          git commit -m 'v0.4.131: use exact uploaded logo originals with corporate UI'
          git push origin HEAD:main
          gh release create v0.4.131 --target "$(git rev-parse HEAD)" --title v0.4.131 --notes 'Exact original horizontal, vertical, and icon-only PNGs uploaded by the user in another conversation, unchanged byte-for-byte. Uniform purple (#8B5CF6), neutral gray (#4B5563), borders and controls across V2, popup, and editors. Playback and saved configuration unaffected. Restart Home Assistant after updating to register the new v131 static logo routes.'
