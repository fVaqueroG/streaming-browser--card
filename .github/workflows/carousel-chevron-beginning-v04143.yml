name: Publish full-height carousel chevron v0.4.143
on:
  push:
    branches: [main]
    paths: ['.github/workflows/carousel-chevron-beginning-v04143.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update carousel button and validate syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('custom_components/streaming_browser/frontend/streaming-browser-card-v2.js')
          s=p.read_text(encoding='utf-8')
          def change(old,new,label):
              global s
              count=s.count(old)
              if count!=1:raise RuntimeError(f'{label}: expected one match, found {count}')
              s=s.replace(old,new,1)
          change('const STREAMING_BROWSER_VERSION = "0.4.142";', 'const STREAMING_BROWSER_VERSION = "0.4.143";', 'version label')
          change('button = createButton(this, \'v2-carousel-beginning\', \'⇤\');', '''button = createButton(this, 'v2-carousel-beginning', '');
                  button.innerHTML = '<ha-icon icon="mdi:chevron-left" aria-hidden="true"></ha-icon>';''', 'carousel icon')
          change('.v2-carousel-frame { display:flex; width:100%; min-width:0; gap:8px; align-items:center; }', '.v2-carousel-frame { display:flex; width:100%; min-width:0; gap:8px; align-items:stretch; }', 'full-height frame')
          change('.v2-expanded-beginning { margin-left:8px; }', '''.v2-carousel-beginning {
                    align-self:stretch; display:flex; align-items:center; justify-content:center;
                    width:44px; min-width:44px; min-height:100%; height:auto;
                    padding:0; border-radius:12px;
                  }
                  .v2-carousel-beginning ha-icon { --mdc-icon-size:28px; width:28px; height:28px; }
                  .v2-expanded-beginning { margin-left:8px; }''', 'match poster height')
          change('@media(max-width:600px){.v2-carousel-frame{gap:5px}.v2-carousel-beginning{padding:7px 6px;font-size:11px}}', '@media(max-width:600px){.v2-carousel-frame{gap:5px}.v2-carousel-beginning{width:38px;min-width:38px;padding:0}}', 'mobile size')
          p.write_text(s,encoding='utf-8')
          m=Path('custom_components/streaming_browser/manifest.json')
          manifest=json.loads(m.read_text(encoding='utf-8'))
          if manifest['version']!='0.4.142':raise RuntimeError('Unexpected release version')
          manifest['version']='0.4.143'
          m.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          node --check custom_components/streaming_browser/frontend/streaming-browser-card-v2.js
          python3 -m json.tool custom_components/streaming_browser/manifest.json >/dev/null
          echo 'PASS: full-height chevron carousel button and JavaScript syntax'
      - name: Commit and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/streaming_browser/frontend/streaming-browser-card-v2.js custom_components/streaming_browser/manifest.json
          git commit -m 'feat: full-poster-height chevron-left carousel Beginning control (v0.4.143)'
          git push origin HEAD:main
          gh release create v0.4.143 --target "$(git rev-parse HEAD)" --title v0.4.143 --notes 'Use mdi:chevron-left on the left-side carousel Beginning button, stretched to match the complete poster/tile height; preserve conditional visibility, horizontal scroll to start, and expanded-catalog Beginning.'
