name: Publish three approved Streaming Browser logos v0.4.122
on:
  push:
    branches: [approved-logos-v04122]
    paths:
      - '.github/workflows/apply-approved-three-v04122.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare and verify all three approved artwork images
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import base64,hashlib
          source=Path('.approved-logo-transfer')
          destination=Path('/tmp/verified-streaming-branding')
          destination.mkdir(exist_ok=True)
          expected={
            'horizontal':'6fb7b7a968cf82eb2052356ab0ee6a1695b10b0fad238914068421d0ec1647c8',
            'vertical':'3066a49d41be740abd24c86b9493c29b772e7667fcd0b37a05f66491927c2b62',
            'icon':'ec713d6fc6a7d385b9e9346feabd50e0158603b3988053ca29b3cb665f8b0937',
          }
          for name in ('horizontal','vertical','icon'):
            if name=='horizontal':
              data=(source/'horizontal.png').read_bytes()
            else:
              count=5 if name=='vertical' else 4
              encoded=''.join((source/f'{name}.{i:02}.b64').read_text() for i in range(1,count+1))
              data=base64.b64decode(encoded,validate=True)
            assert hashlib.sha256(data).hexdigest()==expected[name], f'{name}: upload checksum mismatch'
            with Image.open(BytesIO(data)) as probe:
              probe.load()
              image=probe.convert('RGBA')
            alpha=image.getchannel('A')
            bbox=alpha.getbbox()
            assert bbox and alpha.getextrema()[0]==0, f'{name}: missing image or transparency'
            if name=='horizontal':
              # Remove empty background and expand real artwork, not its blank canvas.
              image=image.crop(bbox)
              width=800
              image=image.resize((width,round(image.height*width/image.width)),Image.Resampling.LANCZOS)
            else:
              assert image.size==(256,256), (name,image.size)
            target=destination/f'streaming-browser-{name}.png'
            image.save(target,format='PNG',optimize=True)
            with Image.open(target) as verified:
              verified.load()
              assert verified.convert('RGBA').getchannel('A').getextrema()[0]==0
            print('PASS',name,target.stat().st_size,image.size,bbox)
          PY
      - name: Apply only three logo replacements to clean main and bump cache version
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B publish-approved-logos origin/main
          test "$(git rev-parse HEAD)" = '7a5470cfc6f19e118f4f59783c320a901abaacad' || { echo 'Main changed; refusing to overwrite newer work'; exit 1; }
          cp /tmp/verified-streaming-branding/*.png custom_components/streaming_browser/frontend/assets/
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('custom_components/streaming_browser')
          manifest=root/'manifest.json'
          info=json.loads(manifest.read_text())
          assert info['version']=='0.4.121',info['version']
          info['version']='0.4.122'
          manifest.write_text(json.dumps(info,indent=2)+'\n')
          v2=root/'frontend/streaming-browser-card-v2.js'
          s=v2.read_text()
          assert 'const STREAMING_BROWSER_VERSION = "0.4.121";' in s
          v2.write_text(s.replace('const STREAMING_BROWSER_VERSION = "0.4.121";','const STREAMING_BROWSER_VERSION = "0.4.122";').replace('?v=0.4.121','?v=0.4.122'))
          popup=root/'frontend/streaming-browser-popup-card.js'
          s=popup.read_text()
          assert '?v=0.4.121' in s
          popup.write_text(s.replace('?v=0.4.121','?v=0.4.122'))
          print('PASS manifest and frontend asset URLs updated to v0.4.122')
          PY
          node --check custom_components/streaming_browser/frontend/streaming-browser-card-v2.js
          node --check custom_components/streaming_browser/frontend/streaming-browser-popup-card.js
          python3 -m compileall -q custom_components/streaming_browser
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/streaming_browser/frontend/assets/streaming-browser-horizontal.png custom_components/streaming_browser/frontend/assets/streaming-browser-vertical.png custom_components/streaming_browser/frontend/assets/streaming-browser-icon.png custom_components/streaming_browser/manifest.json custom_components/streaming_browser/frontend/streaming-browser-card-v2.js custom_components/streaming_browser/frontend/streaming-browser-popup-card.js
          git commit -m 'v0.4.122: overwrite three approved transparent logos'
          git push origin HEAD:main
      - name: Publish HACS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4.122 --target "$(git rev-parse HEAD)" --title v0.4.122 --notes 'Overwrite the three locally bundled Lovelace branding assets (horizontal, vertical, and icon-only) with verified versions derived from the latest approved transparent artwork. The horizontal image is cropped to actual content and enlarged to eliminate the tiny-logo appearance. Home Assistant integration brand/icon files and your card configuration are unchanged. Includes a cache/version bump for both cards. Update in HACS, restart Home Assistant, and hard-refresh your dashboard.'