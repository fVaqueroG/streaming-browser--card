name: Fix Streaming Browser popup remote foreground
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-popup-remote-front-v0140.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Promote floating remote to its own browser top layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          base=Path('custom_components/streaming_browser')
          popup=base/'frontend/streaming-browser-popup-card.js'
          text=popup.read_text()
          marker='/* Popup remote foreground bridge v1 */'
          assert marker not in text, 'Already patched; do not duplicate listeners'
          assert 'class StreamingBrowserPopupCard extends HTMLElement' in text
          assert '_open() {' in text and '_close() {' in text
          bridge=r'''
          /* Popup remote foreground bridge v1 */
          function sbRemoteForeground(popup) {
            let portal=null, attributes=null, top=null, stopped=false;
            const card=()=>popup._innerCard;
            const find=()=>card()?._remotePortal || null;
            function dismiss() {
              const dialog=top; top=null;
              if (!dialog) return;
              if (portal?.parentNode===dialog && portal.isConnected) document.body.appendChild(portal);
              if (dialog.open) dialog.close();
              dialog.remove();
            }
            function sync() {
              if (stopped) return;
              const found=find();
              if (found!==portal) {
                attributes?.disconnect();
                dismiss();
                portal=found;
                if (portal) {
                  attributes=new MutationObserver(sync);
                  attributes.observe(portal,{attributes:true,attributeFilter:['hidden','style','class','aria-hidden']});
                }
              }
              if (!portal?.isConnected || portal.hidden || portal.getAttribute('aria-hidden')==='true' || getComputedStyle(portal).display==='none') {
                dismiss(); return;
              }
              if (top) return;
              const dialog=document.createElement('dialog');
              top=dialog;
              dialog.className='sb-remote-front-dialog';
              dialog.style.cssText='position:fixed;inset:0;margin:0;padding:0;border:0;width:100vw;height:100dvh;max-width:100vw;max-height:100dvh;overflow:visible;background:transparent;color:inherit;';
              const style=document.createElement('style');
              style.textContent='.sb-remote-front-dialog::backdrop{background:transparent!important;backdrop-filter:none!important}';
              dialog.appendChild(style);
              dialog.addEventListener('cancel',event=>{
                event.preventDefault();
                const close=portal?.shadowRoot?.querySelector('.remote-close,.tp-remote-close,[aria-label="Close remote"],[aria-label="Close"]');
                if(close)close.click();
                else if(card()?._toggleRemote)card()._toggleRemote(false);
                else portal.hidden=true;
                queueMicrotask(sync);
              });
              const children=new MutationObserver(()=>queueMicrotask(sync));
              children.observe(dialog,{childList:true});
              dialog.addEventListener('close',()=>children.disconnect(),{once:true});
              document.body.appendChild(dialog);
              dialog.appendChild(portal);
              try { dialog.showModal(); }
              catch(error) { dismiss(); console.error('Streaming Browser remote foreground:',error); }
            }
            const body=new MutationObserver(sync);
            body.observe(document.body,{childList:true});
            const onClick=()=>queueMicrotask(sync);
            document.addEventListener('click',onClick,true);
            const onClose=()=>cleanup();
            popup._dialog?.addEventListener('close',onClose,{once:true});
            function cleanup() {
              if(stopped)return;
              stopped=true;
              attributes?.disconnect(); body.disconnect();
              document.removeEventListener('click',onClick,true);
              popup._dialog?.removeEventListener('close',onClose);
              dismiss();
            }
            sync();
            return cleanup;
          }
          const sbPopupOpenForeground=StreamingBrowserPopupCard.prototype._open;
          StreamingBrowserPopupCard.prototype._open=function(...args) {
            const result=sbPopupOpenForeground.apply(this,args);
            if(this._dialog?.open && !this._remoteForegroundCleanup)
              this._remoteForegroundCleanup=sbRemoteForeground(this);
            return result;
          };
          const sbPopupCloseForeground=StreamingBrowserPopupCard.prototype._close;
          StreamingBrowserPopupCard.prototype._close=function(...args) {
            this._remoteForegroundCleanup?.();this._remoteForegroundCleanup=null;
            return sbPopupCloseForeground.apply(this,args);
          };
          '''
          popup.write_text(text+'\n'+bridge)
          manifest=base/'manifest.json'; data=json.loads(manifest.read_text()); old=data['version']
          assert old=='0.4.139',f'Unexpected base version {old}'
          data['version']='0.4.140';manifest.write_text(json.dumps(data,indent=2)+'\n')
          for filename in ('streaming-browser-card.js','streaming-browser-card-v2.js'):
            path=base/'frontend'/filename
            source=path.read_text()
            source=source.replace('const STREAMING_BROWSER_VERSION = "0.4.139";','const STREAMING_BROWSER_VERSION = "0.4.140";')
            path.write_text(source)
          assert 'const STREAMING_BROWSER_VERSION = "0.4.140";' in (base/'frontend/streaming-browser-card.js').read_text()
          print('PASS: remote native top layer, popup lifecycle cleanup and v0.4.140 alignment')
          PY
          node --check custom_components/streaming_browser/frontend/streaming-browser-popup-card.js
          node --check custom_components/streaming_browser/frontend/streaming-browser-card.js
          node --check custom_components/streaming_browser/frontend/streaming-browser-card-v2.js
      - name: Commit patched integration and publish HACS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/streaming_browser
          git commit -m 'fix: display Streaming Browser popup remote above modal (v0.4.140)'
          git push origin HEAD:main
          gh release create v0.4.140 --target "$(git rev-parse HEAD)" --title v0.4.140 --notes 'Fix remote control stacking above the Streaming Browser popup without changing playback or button handlers.'
