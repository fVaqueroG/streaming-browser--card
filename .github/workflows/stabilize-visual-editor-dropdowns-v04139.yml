name: Stabilize Streaming Browser visual editor dropdowns v0.4.139
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stabilize-visual-editor-dropdowns-v04139.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep visual editor dropdowns mounted
        run: python3 .github/scripts/stabilize_visual_editor_dropdowns_v04139.py
      - name: Validate JavaScript and manifest
        run: |
          node --check custom_components/streaming_browser/frontend/streaming-browser-card.js
          node --check custom_components/streaming_browser/frontend/streaming-browser-card-v2.js
          node --check custom_components/streaming_browser/frontend/streaming-browser-popup-card.js
          python3 -m json.tool custom_components/streaming_browser/manifest.json >/dev/null
          grep -q 'const STREAMING_BROWSER_VERSION = "0.4.139";' custom_components/streaming_browser/frontend/streaming-browser-card.js
      - name: Commit validated changes and trigger existing release workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stabilize-visual-editor-dropdowns-v04139.yml .github/scripts/stabilize_visual_editor_dropdowns_v04139.py
          git add custom_components/streaming_browser
          git commit -m 'v0.4.139: preserve visual editor dropdowns during HA updates'
          git push origin HEAD:main