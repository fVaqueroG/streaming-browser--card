name: Stabilize Streaming Browser visual editor dropdowns v0.4.139
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stabilize-visual-editor-dropdowns-v04139.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep embedded form and popup visual editor dropdowns mounted
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('custom_components/streaming_browser')
          v2=root/'frontend/streaming-browser-card-v2.js'
          popup=root/'frontend/streaming-browser-popup-card.js'
          oldcard=root/'frontend/streaming-browser-card.js'
          s=v2.read_text()
          p=popup.read_text()
          old=oldcard.read_text()
          def once(source,old,new,name):
              assert source.count(old)==1,(name,source.count(old))
              return source.replace(old,new,1)
          s=once(s,'''    form.hass = this._hass;
    if (updateData) form.data = this._config;''','''    // ha-form received hass when created in _render(). Reassigning hass on
    // every HA state tick rebuilds its native selects and closes open menus.
    // The next editor mount receives fresh state, with no interruption now.
    if (updateData) form.data = this._config;''','V2 form hass update')
          s=once(s,'''    if (key !== this._hdmiSchemaKey) {
      this._hdmiSchemaKey = key;
      // Update only when the display TV or its source_list actually changes.''','''    if (key !== this._hdmiSchemaKey &&
        (updateData || !this.matches(':focus-within'))) {
      this._hdmiSchemaKey = key;
      // Never rebuild the HDMI selector while a different dropdown is open.''','V2 HDMI schema update')
          p=once(p,'''  setConfig(config) { this._config = { ...config }; this._render(); }
  set hass(value) { this._hass = value; if (this._v2Editor) this._v2Editor.hass = value; }''','''  setConfig(config) {
    const next={...config};
    const changed=JSON.stringify(next)!==JSON.stringify(this._config);
    this._config=next;
    // Ignore unchanged HA config echoes and do not destroy a dropdown that is
    // currently open in either the popup options or embedded V2 form.
    if(!this._v2Editor||(changed&&!this.matches(':focus-within')))this._render();
  }
  set hass(value) { this._hass = value; if (this._v2Editor) this._v2Editor.hass = value; }''','popup visual editor setters')
          s=once(s,'const STREAMING_BROWSER_VERSION = "0.4.137";','const STREAMING_BROWSER_VERSION = "0.4.139";','V2 version')
          old=once(old,'const STREAMING_BROWSER_VERSION = "0.4.98";','const STREAMING_BROWSER_VERSION = "0.4.139";','bundled V1 version for CI')
          manifest=root/'manifest.json'
          meta=json.loads(manifest.read_text())
          assert meta['version']=='0.4.138',meta['version']
          meta['version']='0.4.139'
          v2.write_text(s)
          popup.write_text(p)
          oldcard.write_text(old)
          manifest.write_text(json.dumps(meta,indent=2)+'\n')
          print('PASS: Streaming Browser V2 and popup configurators preserve active dropdowns')
          PY
      - name: Validate frontend and version alignment
        run: |
          node --check custom_components/streaming_browser/frontend/streaming-browser-card.js
          node --check custom_components/streaming_browser/frontend/streaming-browser-card-v2.js
          node --check custom_components/streaming_browser/frontend/streaming-browser-popup-card.js
          python3 -m json.tool custom_components/streaming_browser/manifest.json >/dev/null
          grep -q 'const STREAMING_BROWSER_VERSION = "0.4.139";' custom_components/streaming_browser/frontend/streaming-browser-card.js
      - name: Commit and trigger existing release workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stabilize-visual-editor-dropdowns-v04139.yml
          git add custom_components/streaming_browser
          git commit -m 'v0.4.139: keep visual editor dropdowns open during updates'
          git push origin HEAD:main